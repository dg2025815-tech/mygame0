<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Bird</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: #111;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      max-height: 800px;
      background: linear-gradient(to bottom, #4dc9ff, #d2f1ff);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      /* 터치 및 마우스 이벤트가 캔버스에 직접 전달되도록 설정 */
      pointer-events: auto;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* UI 레이어가 터치/클릭을 막지 않음 */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      z-index: 10;
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .score-box {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .score-label {
      font-size: 12px;
      color: #aaa;
      text-transform: uppercase;
    }

    .score-value {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
    }

    .high-score .score-value {
      color: #ffd700;
    }

    .message-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 85%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      padding: 30px 20px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      z-index: 30;
      pointer-events: auto; /* 메뉴 화면일 때만 클릭 허용 */
    }

    .hidden {
      display: none !important; /* 완전 은폐로 화면 가림 및 이벤트 간섭 방지 */
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    p {
      font-size: 15px;
      color: #ddd;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .btn {
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    #celebration-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    .new-record-badge {
      display: inline-block;
      background: linear-gradient(45deg, #ffe066, #f59f00);
      color: #000;
      font-weight: 900;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <canvas id="celebration-overlay"></canvas>

    <div class="ui-layer">
      <div class="scoreboard">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-value" id="currentScore">0</div>
        </div>
        <div class="score-box high-score">
          <div class="score-label">Best</div>
          <div class="score-value" id="highScore">0</div>
        </div>
      </div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="message-screen">
      <h1>Flappy Bird</h1>
      <p>화면 터치, 클릭, 또는 스페이스바를 눌러<br>장애물을 피하세요!</p>
      <button class="btn" id="startBtn">게임 시작</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="message-screen hidden">
      <div id="newRecordBadge" class="new-record-badge" style="display: none;">🎉 NEW HIGH SCORE! 🎉</div>
      <h1 id="gameOverTitle">Game Over</h1>
      <p id="gameOverText">아쉽네요! 다시 도전해보세요.</p>
      <button class="btn" id="resetBtn">다시 하기</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const celebCanvas = document.getElementById('celebration-overlay');
    const celebCtx = celebCanvas.getContext('2d');
    const gameContainer = document.getElementById('game-container');

    const currentScoreEl = document.getElementById('currentScore');
    const highScoreEl = document.getElementById('highScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const gameOverTitle = document.getElementById('gameOverTitle');
    const gameOverText = document.getElementById('gameOverText');
    const newRecordBadge = document.getElementById('newRecordBadge');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    function resizeCanvas() {
      canvas.width = gameContainer.clientWidth;
      canvas.height = gameContainer.clientHeight;
      celebCanvas.width = gameContainer.clientWidth;
      celebCanvas.height = gameContainer.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let highScore = localStorage.getItem('flappy_high_score') || 0;
    highScoreEl.textContent = highScore;

    let frames = 0;
    let animationFrameId = null;

    // Bird Object
    const bird = {
      x: 60,
      y: 0,
      radius: 16,
      gravity: 0.38,
      jump: -6.8,
      velocity: 0,
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.velocity * 0.1)));

        // 몸통
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffda79';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#333';
        ctx.stroke();

        // 눈
        ctx.beginPath();
        ctx.arc(6, -4, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(8, -4, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.fill();

        // 부리
        ctx.beginPath();
        ctx.arc(10, 4, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ff5252';
        ctx.fill();

        ctx.restore();
      },
      update() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        // 바닥 충돌
        if (this.y + this.radius >= canvas.height - 40) {
          this.y = canvas.height - 40 - this.radius;
          endGame();
        }
        // 천장 제한
        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.velocity = 0;
        }
      },
      flap() {
        this.velocity = this.jump;
      }
    };

    // Pipes
    const pipes = [];
    const pipeWidth = 60;
    const pipeGap = 160;

    function createPipe() {
      const minHeight = 50;
      const maxHeight = canvas.height - pipeGap - minHeight - 40;
      const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: canvas.height - topHeight - pipeGap - 40,
        passed: false
      });
    }

    function drawPipes() {
      pipes.forEach(pipe => {
        // 위쪽 파이프
        ctx.fillStyle = '#2ed573';
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
        ctx.strokeStyle = '#1e8449';
        ctx.lineWidth = 3;
        ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top);

        ctx.fillRect(pipe.x - 4, pipe.top - 20, pipeWidth + 8, 20);
        ctx.strokeRect(pipe.x - 4, pipe.top - 20, pipeWidth + 8, 20);

        // 아래쪽 파이프
        const bottomY = canvas.height - pipe.bottom - 40;
        ctx.fillRect(pipe.x, bottomY, pipeWidth, pipe.bottom);
        ctx.strokeRect(pipe.x, bottomY, pipeWidth, pipe.bottom);

        ctx.fillRect(pipe.x - 4, bottomY, pipeWidth + 8, 20);
        ctx.strokeRect(pipe.x - 4, bottomY, pipeWidth + 8, 20);
      });
    }

    function updatePipes() {
      if (frames % 90 === 0) createPipe();

      pipes.forEach((pipe, index) => {
        pipe.x -= 2.5;

        // 충돌 판정
        const birdRight = bird.x + bird.radius;
        const birdLeft = bird.x - bird.radius;
        const birdTop = bird.y - bird.radius;
        const birdBottom = bird.y + bird.radius;

        if (birdRight > pipe.x && birdLeft < pipe.x + pipeWidth) {
          if (birdTop < pipe.top || birdBottom > canvas.height - pipe.bottom - 40) {
            endGame();
          }
        }

        // 점수 획득
        if (pipe.x + pipeWidth < bird.x && !pipe.passed) {
          pipe.passed = true;
          score++;
          currentScoreEl.textContent = score;
        }

        // 화면 벗어난 파이프 제거
        if (pipe.x + pipeWidth < 0) {
          pipes.splice(index, 1);
        }
      });
    }

    function drawEnvironment() {
      ctx.fillStyle = '#eccc68';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.fillStyle = '#ff7f50';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 8);
    }

    // Fireworks
    let particles = [];
    function triggerFireworks() {
      particles = [];
      const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#3742fa', '#ffffff', '#ffd700'];
      
      for (let i = 0; i < 150; i++) {
        particles.push({
          x: celebCanvas.width / 2,
          y: celebCanvas.height / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12,
          size: Math.random() * 5 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.015 + 0.005
        });
      }
    }

    function updateFireworks() {
      celebCtx.clearRect(0, 0, celebCanvas.width, celebCanvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(index, 1);
        } else {
          celebCtx.save();
          celebCtx.globalAlpha = p.alpha;
          celebCtx.fillStyle = p.color;
          celebCtx.beginPath();
          celebCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          celebCtx.fill();
          celebCtx.restore();
        }
      });

      if (particles.length > 0 && gameState === 'GAMEOVER') {
        requestAnimationFrame(updateFireworks);
      }
    }

    // --- 점프 제어 핵심 로직 ---
    function triggerJump() {
      if (gameState === 'PLAYING') {
        bird.flap();
      }
    }

    // 키보드 스페이스바 전용 처리
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault(); // 웹 브라우저 스크롤 차단
        triggerJump();
      }
    });

    // 마우스 및 모바일 터치 처리
    function handlePointer(e) {
      // 버튼 눌렀을 때 클릭이 넘어오는 것 방지
      if (e.target.tagName === 'BUTTON') return;
      
      if (gameState === 'PLAYING') {
        if (e.type === 'touchstart') e.preventDefault(); // 모바일 줌/스크롤 방지
        triggerJump();
      }
    }

    gameContainer.addEventListener('mousedown', handlePointer);
    gameContainer.addEventListener('touchstart', handlePointer, { passive: false });

    // 시작 및 재시작 버튼 클릭 이벤트
    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startGame();
    });

    resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startGame();
    });

    function startGame() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);

      gameState = 'PLAYING';
      score = 0;
      frames = 0;
      pipes.length = 0;
      bird.y = canvas.height / 2;
      bird.velocity = 0;
      currentScoreEl.textContent = score;

      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      newRecordBadge.style.display = 'none';

      loop();
    }

    function endGame() {
      gameState = 'GAMEOVER';

      let isNewRecord = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('flappy_high_score', highScore);
        highScoreEl.textContent = highScore;
        isNewRecord = true;
      }

      if (isNewRecord) {
        gameOverTitle.textContent = "🏆 최고 기록 달성! 🏆";
        gameOverText.textContent = `대단해요! ${score}점으로 새로운 기록을 세웠습니다!`;
        newRecordBadge.style.display = 'inline-block';
        triggerFireworks();
        updateFireworks();
      } else {
        gameOverTitle.textContent = "Game Over";
        gameOverText.textContent = `최종 점수: ${score}점\n(최고 기록: ${highScore}점)`;
        newRecordBadge.style.display = 'none';
      }

      gameOverScreen.classList.remove('hidden');
    }

    function loop() {
      if (gameState !== 'PLAYING') return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      bird.update();
      updatePipes();

      drawPipes();
      drawEnvironment();
      bird.draw();

      frames++;
      animationFrameId = requestAnimationFrame(loop);
    }

    // 초기 화면 그리기
    bird.y = canvas.height / 2;
    drawEnvironment();
    bird.draw();
  </script>
</body>
</html>
